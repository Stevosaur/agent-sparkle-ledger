name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (committed snapshot, or fixtures when no snapshot exists yet)
        run: |
          if [ ! -f data/meta.json ]; then export DATA_DIR=tests/fixtures/data; fi
          npm run build
