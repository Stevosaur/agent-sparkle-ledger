name: CI

on:
  pull_request:
  push:
    branches: [main]
  # dispatched by the ingest workflow after it commits a snapshot: pushes made with GITHUB_TOKEN don't start
  # CI on their own (pull_request runs for them wait for manual approval)
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (committed snapshot, or fixtures when no snapshot exists yet)
        run: |
          if [ ! -f data/meta.json ]; then export DATA_DIR=tests/fixtures/data; fi
          npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build against the fixture snapshot
        run: npm run build
        env:
          DATA_DIR: tests/fixtures/data
          NEXT_DIST_DIR: .next-e2e
      - name: Smoke tests (mobile 360px + desktop)
        run: |
          DATA_DIR=tests/fixtures/data NEXT_DIST_DIR=.next-e2e npx next start -p 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/me/ > /dev/null && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3100 npx playwright test
